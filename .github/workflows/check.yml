name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install check tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck busybox jq logrotate
      - name: Static and offline checks
        run: |
          shellcheck -S warning install.sh
          sh -n install.sh
          python3 tests/check.py
          TEST_SHELL=bash python3 tests/check.py
          TEST_SHELL='busybox sh' python3 tests/check.py
      - name: Alpine ash and awk
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.21 sh -c \
            'apk add --no-cache python3 jq logrotate && python3 tests/check.py'
      - name: Official v1.13 binaries and config smoke check
        run: |
          mkdir -p "$RUNNER_TEMP/xboard-binaries"
          for name in xbctl xboard-node; do
            curl -fLsS --retry 2 --max-time 300 \
              "https://github.com/cedar2025/Xboard-Node/releases/download/v1.13/$name-linux-amd64" \
              -o "$RUNNER_TEMP/xboard-binaries/$name"
            chmod +x "$RUNNER_TEMP/xboard-binaries/$name"
          done
          XBOARD_TEST_BINARIES="$RUNNER_TEMP/xboard-binaries" python3 tests/check.py
